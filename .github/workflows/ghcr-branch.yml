name: publish branch image

# Publishes this branch to ghcr.io/<owner>/go-pmtiles:<branch> (and :sha-<sha>)
# for hikeratlas/basemap, which uses `pmtiles merge` to combine its layers.

on:
  workflow_dispatch:
  push:
    branches:
      - 'merge-vector-layers'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test merge
        run: go test ./pmtiles -run 'Merge|Mvt|Dedupe'
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
